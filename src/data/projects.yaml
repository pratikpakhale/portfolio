bridge: "On my own time, I build <em>tools I wish existed</em>: some to learn, some to scratch an itch, some just for fun."

# Lead-in for the homepage's Autopilot section, which lists the `autopilot` items.
autopilotBridge: "A few of them I've handed to agents, and now they <em>run themselves</em>."

# `featured` puts it under highlights, and on the homepage grid unless it's an
# `autopilot` item, which gets its own section.
items:
  - name: "Toot Together"
    live: "https://toottogether.fun"
    year: "2026"
    featured: true
    autopilot: true
    description: "Co-op hippo raft party game for phones and laptops. Every morning an agent reads the analytics and server logs, retunes the rivers crews keep dying on, and ships the fix."
    image: "/projects/toot-together.jpg"
    statsUrl: "/api/toot-together-stats"
    stats:
      - { key: "players", value: "3,479", label: "players" }
      - { key: "countries", value: "125", label: "countries" }

