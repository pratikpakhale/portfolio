  - name: "Rewind"
    repo: "https://github.com/ascend-tech/rewind"
    video: "https://www.youtube.com/watch?v=gna01G1rxFA"
    year: "2022"
    description: "A social network for music, with a voice bot."
    image: null
    story: >
      What if a social media platform was built entirely around music? Not just sharing songs, but
      actually understanding what you're saying. We built a voice bot that listens to natural language
      and takes actions: play a song, search a user, create a post. Wiring up OpenAI was
      straightforward; making it feel natural took most of the time.

  - name: "Velocity Events"
    repo: "https://github.com/pratikpakhale/velocity-event-management"
    year: "2022"
    featured: true
    description: "Event platform for college clubs."
    image: null
    stats:
      - { value: "125k+", label: "API calls" }
    story: >
      Built this because our college club needed a real event platform, not Google Forms. Registration,
      ticketing, check-in: the whole flow. It's handled 125k+ API calls so far, and keeping it up
      taught me a lot about production reliability.

  - name: "vChar"
    repo: "https://github.com/pratikpakhale/vchar"
    year: "2024"
    description: "AI researcher that runs parallel web searches, ranks results by relevance, and summarizes with citations."
    image: null
    story: >
      I was tired of googling the same things and reading 10 articles to get one answer, so I built
      something that does it in parallel and gives me a cited summary. Most of the work went into
      ranking results across multiple search engines, since they tend to converge on the same handful
      of SEO-tuned pages.

  - name: "Tweemarks"
    repo: "https://github.com/pratikpakhale/tweemarks-v2"
    year: "2022"
    description: "Twitter bookmarking tool with a Telegram bot. Save tweets, access anywhere. Taken down when Twitter API pricing changed."
    image: null
    story: >
      Twitter's bookmark feature in 2022 had no search, no tags, no export. So I built
      Tweemarks with a Telegram bot that lets you forward tweets and they get saved with tags.
      Had real users until Twitter killed free API access. RIP.

  - name: "uhmegle"
    description: "Omegle MITM: a proxy that lets you spy on what two random strangers are talking about. \"For education\"."
    image: null

