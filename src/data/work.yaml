bridge: "I've spent the last couple years <em>shipping real products</em> at places that gave me hard problems to solve."

positions:
  - hash: "HEAD"
    date: "Dec 2024 — present"
    title: "Founding Engineer"
    company: "Raccoon AI · Browser agents"
    diff:
      - type: plus
        text: "Motion Graphics Video Creator — a text-to-video motion graphics system with a React-based rendering engine, a director's board approval flow, parallelized frame-by-frame export on serverless GPUs, and a complete audio toolkit"
      - type: plus
        text: "Local Browser Agent — browser control system with an extension, a DOM snapshot engine, let Raccoon control your local browser to gather better context"
      - type: plus
        text: "Canvas Editor — an infinite pannable canvas for image management with AI inpainting, bg removal, upscale, and resizing"
      - type: plus
        text: "Raccoon Inspect — a zero-config Babel plugin + vanilla JS runtime that auto-instruments every JSX element with source metadata, injects a full inspect-mode UI with hover to let Raccoon get context of the element"
      - type: plus
        text: "Streaming Architecture — a dual-model (ephemeral events vs. persisted blocks) real-time streaming pipeline with an event emitter/coalescer/reducer, WebSocket transport, a streaming JSON parser with lexer caching for live tool parameter rendering"
      - type: plus
        text: "Chat App State & Performance — use zustand and manage global states, cut First Load JS by 44% via dynamic imports and tree-shaking, achieved a 250x faster event pipeline and 5.6x fewer re-renders through lock-free batched processing and Map-based block storage, and fixed keystroke layout thrashing down to ~5ms with content-visibility: auto and RAF-batched textarea resizing"
      - type: plus
        text: "Elemetry — a graph-based DOM element caching and action prediction system that records browser automation traces, generates vector embeddings of element roles, and uses a two-phase prediction algorithm (node similarity + timeline path matching) to shortcut the AI agent's expensive LLM inference loop — enabling instant replay of previously-seen interactions with graceful fallback to full reasoning on cache miss"
    story: >
      Joined as an intern, now founding engineer. Raccoon is building browser agents that actually work —
      the kind that remember what you did yesterday and skip the repetitive clicks today. My biggest
      contribution was Elemetry: a cache engine that stores browser actions as a vector graph, so the
      agent can replay your past browsing patterns instead of figuring things out from scratch every time.
      The hard part wasn't the vector search — it was making the graph structure capture intent, not just actions.

  - hash: "a7f3e2d"
