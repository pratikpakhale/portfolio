      - type: plus
        text: "Shipped as Docker container and Electron app for offline use"
      - type: plus
        text: "Lead backend developer on GeoGuru — LMS with geographical information system"
    story: >
      Started as a summer research intern, stayed on because the problems were interesting. The affect-aware
      system uses video bots that adapt based on how engaged students are — the deep learning model runs
      on Flask and feeds back into the React frontend in real-time. GeoGuru was the bigger challenge:
      building a full LMS that integrates QGIS for spatial data. I own the backend architecture and it
      needs to handle concurrent map rendering sessions, which is a different beast from typical CRUD.
